<!-- [grafico] Ventana de búsqueda de indicadores -->
<div id="ind-modal-overlay" style="display:none;">
    <div id="ind-modal-box">
        <div class="ind-cab">
            <span class="ind-titulo">Indicadores técnicos</span>
            <button id="ind-modal-close" title="Cerrar">✕</button>
        </div>
        <div class="ind-buscar">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="#8b949e" stroke-width="2"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4 4"/></svg>
            <input type="text" id="ind-search-input" placeholder="Buscar indicador (ej. RSI, media, Bollinger, volumen…)">
        </div>
        <div id="ind-tabs"></div>
        <div id="ind-list-container"></div>
        <div class="ind-pie">Puedes añadir el mismo indicador varias veces (p. ej. dos medias con distinto periodo). El engranaje ajusta periodos y colores.</div>
    </div>
</div>
